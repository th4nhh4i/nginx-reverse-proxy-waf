# /etc/fail2ban/filter.d/nginx-404.conf
# Bắt IP quét lỗ hổng: nhiều request liên tiếp trả về 404.

[Definition]

failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS).*" 404 .*$

ignoreregex = ^<HOST> -.*"GET /(favicon\.ico|robots\.txt|apple-touch-icon.*) HTTP.*" 404 .*$

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
