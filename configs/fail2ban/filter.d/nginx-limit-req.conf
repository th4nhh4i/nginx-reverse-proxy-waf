# /etc/fail2ban/filter.d/nginx-limit-req.conf
# Bắt IP chạm trần limit_req / limit_conn — dấu hiệu HTTP Flood.
#
# Nginx ghi hai loại cảnh báo khác nhau cho hai chỉ thị này, cần cả hai regex.

[Definition]

failregex = ^\s*\[warn\] \d+#\d+: \*\d+ limiting requests, excess: [\d\.]+ by zone "[^"]+", client: <HOST>
            ^\s*\[warn\] \d+#\d+: \*\d+ limiting connections by zone "[^"]+", client: <HOST>

ignoreregex =

datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
