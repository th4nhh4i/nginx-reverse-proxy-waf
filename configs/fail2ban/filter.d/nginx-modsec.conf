# /etc/fail2ban/filter.d/nginx-modsec.conf
# Bắt các IP bị ModSecurity chặn trong error.log của Nginx.
#
# ModSecurity ghi IP nguồn ở cuối dòng dưới dạng [client 1.2.3.4],
# khác với access.log vốn để IP ở đầu dòng — nên không dùng chung filter được.

[Definition]

failregex = \[client <HOST>\] ModSecurity: Access denied with code 403
            \[client <HOST>\] ModSecurity: .*Inbound Anomaly Score Exceeded
            ModSecurity: Access denied with code 403.*\[client <HOST>\]

ignoreregex =

datepattern = ^%%Y/%%m/%%d %%H:%%M:%%S
