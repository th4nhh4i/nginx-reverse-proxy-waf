# Danh sách IP bị chặn — file này được Splunk SOAR ghi đè tự động.
#
# Playbook SOAR kết nối SSH tới máy Nginx, append dòng `deny <ip>;` vào đây
# rồi chạy `nginx -t && systemctl reload nginx`. Vì vậy KHÔNG sửa tay file này
# trên máy production: thay đổi sẽ bị playbook ghi đè ở lần chặn kế tiếp.
#
# Muốn chặn vĩnh viễn một IP, thêm vào conf.d/blacklist-static.conf.

# deny 192.168.224.128;
