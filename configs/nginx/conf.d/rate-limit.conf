# Chống DDoS tầng 7 (HTTP Flood, Slowloris) tại lớp Nginx.
# Đặt tại: /etc/nginx/conf.d/rate-limit.conf
#
# Các chỉ thị limit_req_zone / limit_conn_zone phải nằm trong block http {},
# nên file này được include từ nginx.conf chứ không phải từ block server.

# 10MB zone ~ 160.000 địa chỉ IP. rate=10r/s là ngưỡng cho phép mỗi IP.
limit_req_zone  $binary_remote_addr  zone=req_per_ip:10m  rate=10r/s;

# Giới hạn số kết nối đồng thời mỗi IP — đây là lớp chặn Slowloris,
# vốn tấn công bằng cách giữ nhiều kết nối mở thay vì gửi nhiều request.
limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;

# Trả 429 thay vì 503 mặc định để Fail2Ban và Splunk phân biệt được
# "bị giới hạn tốc độ" với "backend chết".
limit_req_status  429;
limit_conn_status 429;

limit_req_log_level warn;

# Cắt các kết nối chậm bất thường — đặc trưng của Slowloris/Slow POST.
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          10s;
keepalive_timeout     15s;

# Chặn request body quá khổ dùng để làm cạn RAM.
client_max_body_size      10m;
client_body_buffer_size  128k;
