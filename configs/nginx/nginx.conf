# /etc/nginx/nginx.conf
#
# Chỉ giữ các phần khác với bản mặc định của Ubuntu. Hai điểm quan trọng:
#   1. load_module phải nằm ở context chính, TRƯỚC block events {}
#   2. include conf.d/*.conf phải nằm trong block http {} vì các zone
#      limit_req_zone / limit_conn_zone không hợp lệ ở context server.

load_module /etc/nginx/modules-enabled/ngx_http_modsecurity_module.so;

user  www-data;
worker_processes  auto;
pid  /run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    types_hash_max_size 2048;
    server_tokens   off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Ghi thêm $upstream_addr để Splunk xác định được request đã đi tới
    # backend nào — cần cho việc kiểm chứng load balancer trong báo cáo.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream=$upstream_addr rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    gzip  on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
