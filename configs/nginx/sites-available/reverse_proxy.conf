# Nginx Reverse Proxy + Load Balancer + WAF + DDoS mitigation
#
# Đặt tại: /etc/nginx/sites-available/reverse_proxy
# Kích hoạt: sudo ln -s /etc/nginx/sites-available/reverse_proxy /etc/nginx/sites-enabled/
#
# Thay các IP dưới đây bằng dải mạng thực tế của bạn trước khi triển khai.

upstream dvwa_backend {
    # ip_hash giữ session dính với một backend cố định — cần thiết vì DVWA
    # lưu session PHP cục bộ trên từng máy, không chia sẻ qua Redis/DB.
    ip_hash;

    server 192.168.63.132:80 max_fails=3 fail_timeout=30s;
    server 192.168.63.135:80 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nginx.lab.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nginx.lab.com;

    ssl_certificate     /etc/nginx/ssl/nginx.lab.com.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.lab.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- WAF ---
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # --- Danh sách chặn do Splunk SOAR ghi vào qua SSH/SCP ---
    include /etc/nginx/conf.d/banips.conf;

    # --- Giới hạn lưu lượng (zone khai báo trong conf.d/rate-limit.conf) ---
    limit_req  zone=req_per_ip  burst=20 nodelay;
    limit_conn conn_per_ip 10;

    # Ẩn phiên bản Nginx khỏi response header
    server_tokens off;

    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://dvwa_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Nếu một backend trả lỗi hoặc timeout, thử backend còn lại
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
