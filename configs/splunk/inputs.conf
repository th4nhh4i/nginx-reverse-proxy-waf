# /opt/splunkforwarder/etc/system/local/inputs.conf
#
# Cài trên máy Nginx Reverse Proxy. Universal Forwarder đọc các file dưới đây
# và đẩy về Splunk Indexer qua cổng 9997.

[default]
host = nginx-proxy

[monitor:///var/log/nginx/access.log]
index      = web
sourcetype = nginx_access
disabled   = false

[monitor:///var/log/nginx/error.log]
index      = web
sourcetype = nginx_error
disabled   = false

# Audit log của ModSecurity — nguồn dữ liệu chính để nhận diện
# vector tấn công và điểm anomaly score.
[monitor:///var/log/modsec_audit.log]
index      = security
sourcetype = modsec_audit
disabled   = false

[monitor:///var/log/fail2ban.log]
index      = security
sourcetype = fail2ban
disabled   = false

[monitor:///var/log/auth.log]
index      = security
sourcetype = linux_secure
disabled   = false
