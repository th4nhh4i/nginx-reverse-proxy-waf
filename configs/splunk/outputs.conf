# /opt/splunkforwarder/etc/system/local/outputs.conf
#
# Trỏ Universal Forwarder về Splunk Indexer.
# Xác thực trạng thái bằng:
#   sudo /opt/splunkforwarder/bin/splunk list forward-server
# Kết quả mong đợi: "Active forwards: 192.168.121.160:9997"

[tcpout]
defaultGroup     = siem_indexers
disabled         = false
indexAndForward  = false

[tcpout:siem_indexers]
server = 192.168.121.160:9997

# Giữ log lại tối đa 5GB khi indexer mất kết nối, thay vì vứt bỏ.
# Nếu không có dòng này, log sinh ra trong lúc SIEM chết sẽ mất vĩnh viễn —
# đúng khoảng thời gian cần điều tra nhất.
maxQueueSize   = 5GB
useACK         = true
autoLBFrequency = 30
